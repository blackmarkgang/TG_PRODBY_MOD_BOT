services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prodby
      POSTGRES_USER: prodby
      POSTGRES_PASSWORD: prodby
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodby -d prodby"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ./backend
    command: python -m app.bot.main
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./admin-web:/app
    depends_on:
      - api

volumes:
  postgres_data:
