x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prodby}
      POSTGRES_USER: ${POSTGRES_USER:-prodby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodby}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  bot:
    build:
      context: ./backend
    command: python -m app.bot.main
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  admin-web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_DEV_ADMIN_ID: ${DEV_ADMIN_ID:-1692840322}
    ports:
      - "5173:5173"
    volumes:
      - ./admin-web:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      - api
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    command: ["sh", "/opt/backup/backup.sh"]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-prodby}
      PGUSER: ${POSTGRES_USER:-prodby}
      PGPASSWORD: ${POSTGRES_PASSWORD:-prodby}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/opt/backup/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  admin_node_modules:
